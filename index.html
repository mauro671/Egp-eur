<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGP to EUR Currency Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .currency-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .currency-group select {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            color: #333;
            font-weight: 500;
            display: none;
        }

        #result.show {
            display: block;
        }

        #error {
            margin-top: 10px;
            padding: 10px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        #error.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 25px;
            }

            input[type="number"],
            select,
            button {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💱 Currency Converter</h1>
        
        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label>From</label>
            <select id="currencyFrom">
                <option value="EGP">EGP - Egyptian Pound</option>
                <option value="EUR">EUR - Euro</option>
                <option value="USD">USD - US Dollar</option>
                <option value="GBP">GBP - British Pound</option>
            </select>
        </div>

        <div class="input-group">
            <label>To</label>
            <select id="currencyTo">
                <option value="EUR">EUR - Euro</option>
                <option value="EGP">EGP - Egyptian Pound</option>
                <option value="USD">USD - US Dollar</option>
                <option value="GBP">GBP - British Pound</option>
            </select>
        </div>

        <button id="convertBtn">Convert</button>

        <p id="result"></p>
        <p id="error"></p>
    </div>

    <script>
        const convertBtn = document.getElementById('convertBtn');
        const amountInput = document.getElementById('amount');
        const resultElement = document.getElementById('result');
        const errorElement = document.getElementById('error');

        async function performConversion() {
            const amount = parseFloat(amountInput.value);
            const currencyFrom = document.getElementById('currencyFrom').value;
            const currencyTo = document.getElementById('currencyTo').value;

            resultElement.classList.remove('show');
            errorElement.classList.remove('show');

            if (!amount || amount <= 0 || isNaN(amount)) {
                errorElement.textContent = '❌ Please enter a valid amount.';
                errorElement.classList.add('show');
                return;
            }

            if (currencyFrom === currencyTo) {
                resultElement.textContent = `${amount} ${currencyFrom} = ${amount.toFixed(2)} ${currencyTo}`;
                resultElement.classList.add('show');
                return;
            }

            try {
                const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${currencyFrom}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                const rate = data.rates[currencyTo];
                
                if (!rate) {
                    errorElement.textContent = '❌ Currency not found.';
                    errorElement.classList.add('show');
                    return;
                }

                const convertedAmount = (amount * rate).toFixed(2);
                resultElement.textContent = `${amount} ${currencyFrom} = ${convertedAmount} ${currencyTo}`;
                resultElement.classList.add('show');
            } catch (error) {
                console.error('Error:', error);
                errorElement.textContent = '❌ Error fetching exchange rates. Please try again.';
                errorElement.classList.add('show');
            }
        }

        convertBtn.addEventListener('click', performConversion);
        amountInput.addEventListener('input', performConversion);
        amountInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performConversion();
        });
    </script>
</body>
</html>
