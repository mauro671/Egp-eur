<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>EGP to EUR Currency Converter</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }\n        h1 { text-align: center; }\n        input[type='number'] { width: 100%; padding: 10px; margin: 10px 0; }\n        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }\n        button:hover { background-color: #218838; }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <h1>EGP to EUR Currency Converter</h1>\n        <input type="number" id="egpAmount" placeholder="Enter amount in EGP">\n        <button onclick="convertCurrency()">Convert to EUR</button>\n        <h2 id="result"></h2>\n    </div>\n\n    <script>\n        function convertCurrency() {\n            const exchangeRate = 0.048; // Example exchange rate\n            const egpAmount = document.getElementById('egpAmount').value;\n            const eurAmount = egpAmount * exchangeRate;\n            document.getElementById('result').innerText = `Amount in EUR: €${eurAmount.toFixed(2)}`;\n        }\n    </script>\n</body>\n</html>
