<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Premium</title>

<style>
:root {
  --bg:#0f172a;
  --card:#111827;
  --text:#ffffff;
  --sub:#9ca3af;
  --accent:#22c55e;
}

body.light {
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#111;
  --sub:#666;
  --accent:#16a34a;
}

body {
  margin:0;
  font-family:-apple-system,system-ui;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.container {
  max-width:420px;
  margin:auto;
  padding:20px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.card {
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.amount {
  font-size:42px;
  border:none;
  background:none;
  color:var(--text);
  width:100%;
  outline:none;
}

.currency {
  font-size:16px;
  color:var(--sub);
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button {
  border:none;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
}

.primary {
  background:var(--accent);
  color:white;
  width:100%;
  font-size:18px;
}

.switch {
  font-size:22px;
  cursor:pointer;
}

.result {
  font-size:32px;
  text-align:center;
  margin-top:10px;
}

.small {
  text-align:center;
  color:var(--sub);
  font-size:12px;
}

canvas {
  width:100%;
}

.toggle {
  cursor:pointer;
  font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>💱 FX</h2>
<div class="toggle" onclick="toggleTheme()">🌗</div>
</div>

<div class="card">
<div class="row">
<input class="amount" id="amount" placeholder="0">
<span class="currency" id="from">EGP</span>
</div>

<div class="row">
<span class="currency">→</span>
<div class="switch" onclick="swap()">⇅</div>
</div>

<div class="row">
<div class="result" id="result">0</div>
<span class="currency" id="to">EUR</span>
</div>

<button class="primary" onclick="convert()">Converti</button>

<div class="small" id="rate">Caricamento...</div>
</div>

<div class="card">
<h3>Trend</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let rates = {};
let from = "EGP";
let to = "EUR";
let history = JSON.parse(localStorage.getItem("history") || "[]");

// Tema
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light");
}

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",
    document.body.classList.contains("light") ? "light":"dark"
  );
}

// Swap valuta
function swap(){
  [from,to] = [to,from];
  document.getElementById("from").innerText = from;
  document.getElementById("to").innerText = to;
  convert();
}

// Fetch cambio
async function fetchRates(){
  try{
    let res = await fetch("https://api.exchangerate.host/latest?base=EGP");
    let data = await res.json();
    rates = data.rates;

    saveHistory(rates.EUR);

    document.getElementById("rate").innerText =
      "1 EGP = " + rates.EUR.toFixed(4) + " EUR";
  }catch{
    document.getElementById("rate").innerText = "Offline";
  }
}

// Converti
function convert(){
  let val = parseFloat(document.getElementById("amount").value);

  if(!val) return;

  let result;

  if(from==="EGP"){
    result = val * rates[to];
  } else {
    result = val / rates[from];
  }

  document.getElementById("result").innerText =
    result.toFixed(2);
}

// Storico
function saveHistory(v){
  history.push(v);
  if(history.length>20) history.shift();
  localStorage.setItem("history",JSON.stringify(history));
  drawChart();
}

// Grafico minimal premium
function drawChart(){
  const c = document.getElementById("chart");
  const ctx = c.getContext("2d");

  c.width = 320;
  c.height = 140;

  ctx.clearRect(0,0,c.width,c.height);

  if(history.length<2) return;

  let max = Math.max(...history);
  let min = Math.min(...history);

  ctx.beginPath();

  history.forEach((v,i)=>{
    let x = i*(c.width/(history.length-1));
    let y = c.height - ((v-min)/(max-min))*120;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.stroke();
}

// Auto convert mentre scrivi
document.getElementById("amount").addEventListener("input",convert);

fetchRates();
drawChart();
</script>

</body>
</html>
